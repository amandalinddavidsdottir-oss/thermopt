solver_options:
  library: scipy
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 1e-6
  print_convergence: true
  plot_convergence: false
  logger: None
  update_on: gradient
  tolerance: 1e-6
  max_iterations: 100
  problem_scale: 20
  callbacks:
    save_plot: True
    save_config: True
    save_report: True
    plot_cycle: True
    plot_convergence: false

problem_formulation:
  cycle_topology: dual_pressure_dual_brine

  plot_settings:
    pinch_point_diagram: false
    fluid:
      plot_saturation_line: true
      plot_critical_point: true
      plot_quality_isolines: true
      plot_pseudocritical_line: false
      plot_triple_point_liquid: false
      plot_triple_point_vapor: false
    diagrams:
    - x_prop: s
      y_prop: T
      x_scale: linear
      y_scale: linear
      plot_heat_source: true
      plot_heat_sink: true

  fixed_parameters:
    working_fluid:
      name: Toluene
      backend: HEOS
      exceptions: true
    heating_fluid:
      name: water
      backend: HEOS
      exceptions: true
    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: true
    special_points:
      ambient_pressure: 101325
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 512.03  # K = 238.88°C — HP brine (243.88°C) minus 5K pinch

    heat_source_hp:
      inlet_enthalpy: 1845800       # J/kg
      inlet_pressure: 3581300       # Pa
      exit_pressure: 3581300        # Pa
      minimum_temperature: 373.15   # K (100°C reinjection limit)

    heat_source_lp:
      inlet_enthalpy: 1382080       # J/kg
      inlet_pressure: 1801300       # Pa
      exit_pressure: 1801300        # Pa
      minimum_temperature: 373.15   # K (100°C reinjection limit)

    hp_well_fraction: 0.2

    heat_sink:
      inlet_temperature: 295.15
      inlet_pressure: 101325
      exit_pressure: 101325

    hp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    lp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    preheater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    # HP expander: small pressure ratio (~1.7) — fixed n_stages=1, no multi-stage needed.
    # RPM and n_stages are fixed; only LP expander is swept in the parametric study.
    hp_expander:
      efficiency_type: "astolfi-stacking"
      n_stages: 1
      RPM: 1000
      n_turbines_parallel: 1

    # LP expander: large pressure ratio (~150 isentropic, ~40 with Vr constraint).
    # This is the expander swept in the parametric study (n_stages, RPM).
    # n_turbines_parallel=2 as per simple ORC basecase.
    lp_expander:
      efficiency_type: "astolfi-stacking"
      n_stages: 1
      RPM: 1000
      n_turbines_parallel: 2

    lp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"
    hp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"

    heat_source_pump_hp:
      efficiency: 0.80
      efficiency_type: "isentropic"
    heat_source_pump_lp:
      efficiency: 0.80
      efficiency_type: "isentropic"

    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"

  # ============================================================================
  # DESIGN VARIABLES
  # Warmstart values from isentropic optimized run, with compressor_inlet_pressure
  # updated to ~17513 Pa to avoid CoolProp saturation singularity during gradient
  # evaluation (same fix as applied to simple and recuperated Macchi-Astolfi cases).
  # ============================================================================
  design_variables:

    mass_split_fraction:
      min: 0.01
      max: 0.99
      value: 0.307932206347

    mass_flow_rate_cycle:
      min: 20.0
      max: 1500.0
      value: 272.926088644091

    mass_flow_rate_sink:
      min: 100.0
      max: 20000.0
      value: 6358.757136579374

    well_mass_flow_rate_total:
      min: 1.0
      max: 600.0
      value: 169.323029686105

    heat_source_hp_evap_exit_temperature_fraction:
      min: 0.01
      max: 0.99
      value: 0.01

    heat_source_lp_evap_exit_temperature_fraction:
      min: 0.01
      max: 0.99
      value: 0.537991779524

    heat_source_preheater_exit_temperature_fraction:
      min: 0.01
      max: 0.99
      value: 0.01

    heat_sink_exit_temperature:
      min: 300.15
      max: 315.15
      value: 300.15

    compressor_inlet_pressure:
      min: 1*$working_fluid.liquid_at_ambient_temperature.p
      max: 6.0*$working_fluid.liquid_at_ambient_temperature.p
      value: 17513.658425684724  # updated from isentropic 5142 Pa — prevents CoolProp crash

    compressor_inlet_enthalpy:
      min: 0.0*($working_fluid.critical_point.h -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      max: 0.5*($working_fluid.critical_point.h -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      value: -154861.4517609643  # consistent with updated compressor_inlet_pressure

    preheater_outlet_enthalpy:
      min: 0.0*($working_fluid.critical_point.h -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      max: 1*($working_fluid.critical_point.h -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      value: -27963.930876185506

    lp_expander_inlet_pressure_fraction:
      min: 0.01
      max: 0.99
      value: 0.414369497799

    lp_evaporator_outlet_enthalpy:
      min: 0.0*($working_fluid.gas_at_maximum_temperature.h -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      max: 1*($working_fluid.gas_at_maximum_temperature.h  -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      value: 485604.3068077117

    hp_expander_inlet_pressure:
      min: $working_fluid.liquid_at_ambient_temperature.p
      max: 2*$working_fluid.critical_point.p
      value: 1313323.5720729085

    hp_expander_inlet_enthalpy:
      min: 0.0*($working_fluid.gas_at_maximum_temperature.h -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      max: 1*($working_fluid.gas_at_maximum_temperature.h  -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      value: 544218.3355278892

    # ── LP expander intermediate pressures (added by parametric study script) ──
    # lp_expander_intermediate_pressure_1:
    #   min: $working_fluid.liquid_at_ambient_temperature.p
    #   max: 2*$working_fluid.critical_point.p
    #   value: ...
    # lp_expander_intermediate_pressure_2:
    #   min: $working_fluid.liquid_at_ambient_temperature.p
    #   max: 2*$working_fluid.critical_point.p
    #   value: ...


  constraints:
  - variable: $components.hp_evaporator.temperature_difference
    type: ">"
    value: 5
    normalize: true

  - variable: $components.lp_evaporator.temperature_difference
    type: ">"
    value: 5
    normalize: true

  - variable: $components.preheater.temperature_difference
    type: ">"
    value: 5
    normalize: true

  - variable: $components.cooler.temperature_difference
    type: ">"
    value: 5
    normalize: true

  - variable: $components.lp_pump.state_in.subcooling
    type: ">"
    value: 1.0
    normalize: true

  - variable: $components.hp_pump.state_in.subcooling
    type: ">"
    value: 1.0
    normalize: true

  - variable: $components.hp_expander.state_in.superheating
    type: ">"
    value: 5
    normalize: true

  - variable: $components.lp_expander.state_in.superheating
    type: ">"
    value: 5
    normalize: true

  - variable: $energy_analysis.net_system_power
    type: "="
    value: 45000000
    normalize: true

  # ── HP expander Ns and Vr constraints ──
  - variable: $components.hp_expander.data_out.stage_Ns
    type: ">"
    value: 0.045
    normalize: True

  - variable: $components.hp_expander.data_out.stage_Ns
    type: "<"
    value: 0.195
    normalize: True

  - variable: $components.hp_expander.data_out.stage_Vr
    type: "<"
    value: 5.0
    normalize: True

  - variable: $components.hp_expander.data_out.stage_Vr
    type: ">"
    value: 1.2
    normalize: True

  # ── LP expander Ns and Vr constraints ──
  - variable: $components.lp_expander.data_out.stage_Ns
    type: ">"
    value: 0.045
    normalize: True

  - variable: $components.lp_expander.data_out.stage_Ns
    type: "<"
    value: 0.195
    normalize: True

  - variable: $components.lp_expander.data_out.stage_Vr
    type: "<"
    value: 5.0
    normalize: True

  - variable: $components.lp_expander.data_out.stage_Vr
    type: ">"
    value: 1.2
    normalize: True

  # ── LP expander intermediate pressure ordering constraints ──
  # (managed automatically by parametric study script)
  # - variable: $components.lp_expander.state_in.p / $variables.lp_expander_intermediate_pressure_1
  #   type: ">"
  #   value: 1.0
  #   normalize: True

  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
