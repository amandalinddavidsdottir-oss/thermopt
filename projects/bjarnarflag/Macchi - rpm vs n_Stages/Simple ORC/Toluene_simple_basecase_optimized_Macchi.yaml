solver_options:
  library: scipy
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 1e-6
  print_convergence: true
  plot_convergence: false
  logger: None
  update_on: gradient
  tolerance: 1e-6
  max_iterations: 100
  problem_scale: 20
  callbacks:
    save_plot: False
    save_config: False
    save_report: False
    plot_cycle: False
    plot_convergence: false


problem_formulation:

  cycle_topology: simple

  plot_settings:
    pinch_point_diagram: false
    fluid:
      plot_saturation_line: true
      plot_critical_point: true
      plot_quality_isolines: true
      plot_pseudocritical_line: false
      plot_triple_point_liquid: false
      plot_triple_point_vapor: false
    diagrams:
    - x_prop: s
      y_prop: T
      x_scale: linear
      y_scale: linear
      plot_heat_source: true
      plot_heat_sink: true


  fixed_parameters:

    working_fluid:
      name: Toluene
      backend: HEOS
      exceptions: true

    heating_fluid:
      name: water
      backend: HEOS
      exceptions: true

    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: true

    special_points:
      ambient_pressure: 101325
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 475.30  # K = 202.15°C — single brine (207.15°C) minus 5K pinch

    heat_source:
      inlet_enthalpy: 1459430  # J/kg — two-phase brine (x=0.30), T_sat=207.15°C, P=18.013 bar-a
      minimum_temperature: 373.15
      inlet_pressure: 1801300
      exit_pressure: 1801300

    heat_sink:
      inlet_temperature: 295.15
      inlet_pressure: 101325
      exit_pressure: 101325

    heater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    expander:
      efficiency_type: "astolfi-stacking"
      n_stages: 1
      RPM: 1000
      n_turbines_parallel: 2

    compressor:
      efficiency: 0.85
      efficiency_type: "isentropic"

    heat_source_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"

    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"


  # ============================================================================
  # DESIGN VARIABLES
  # Warmstart values taken from optimal_solution.yaml (last run),
  # which is a better starting point than the original isentropic basecase.
  # Intermediate pressure warmstarts recomputed for equal geometric stage split:
  #   p_in=712857 Pa, p_out≈17690 Pa, PR_total=40.3, PR_per_stage=3.43
  #   p_int1 = 712857 / 3.43 ≈ 208000 Pa
  #   p_int2 = 208000 / 3.43 ≈  61000 Pa
  # ============================================================================
  design_variables:

    well_mass_flow_rate:
      min: 1
      max: 600.0
      value: 235.625670026581       # from last run

    mass_flow_rate_cycle:
      min: 20.0
      max: 1500.0
      value: 378.726880329373       # from last run

    mass_flow_rate_sink:
      min: 100.0
      max: 20000.0
      value: 1741.496998371903      # from last run

    heat_source_exit_temperature:
      min: 373.15
      max: 479.30
      value: 373.15

    heat_sink_exit_temperature:
      min: 300.15
      max: 315.15
      value: 315.15

    compressor_inlet_pressure:
      min: 1*$working_fluid.liquid_at_ambient_temperature.p
      max: 6.0*$working_fluid.liquid_at_ambient_temperature.p
      value: 17513.658425684724     # from last run

    compressor_inlet_enthalpy:
      min: 0.0*($working_fluid.critical_point.h -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      max: 0.5*($working_fluid.critical_point.h -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      value: -154861.4517609643     # from last run

    expander_inlet_pressure:
      min: $working_fluid.liquid_at_ambient_temperature.p
      max: 2*$working_fluid.critical_point.p
      value: 712857.7368177013      # from last run

    expander_inlet_enthalpy:
      min: 0.0*($working_fluid.gas_at_maximum_temperature.h -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      max: 1*($working_fluid.gas_at_maximum_temperature.h  -
        $working_fluid.liquid_at_ambient_temperature.h) +
        $working_fluid.liquid_at_ambient_temperature.h
      value: 491788.2873777397      # from last run

    # ── Intermediate stage pressures (n_stages=3 → 2 intermediate pressures) ──
    # Bounds match expander_inlet_pressure bounds (same feasible space).
    # Ordering constraints below enforce p_in > p_int1 > p_int2 > p_out.
    # expander_intermediate_pressure_1:
    #   min: $working_fluid.liquid_at_ambient_temperature.p
    #   max: 2*$working_fluid.critical_point.p
    #   value: 208000                 # = 712857 / 3.43  (equal geometric split)

    # expander_intermediate_pressure_2:
    #   min: $working_fluid.liquid_at_ambient_temperature.p
    #   max: 2*$working_fluid.critical_point.p
    #   value: 61000                  # = 208000 / 3.43  (equal geometric split)


  # ============================================================================
  # CONSTRAINTS
  # ============================================================================
  constraints:

  - variable: $components.heater.temperature_difference
    type: ">"
    value: 5
    normalize: true

  - variable: $components.cooler.temperature_difference
    type: ">"
    value: 5
    normalize: true

  - variable: $components.compressor.state_in.subcooling
    type: ">"
    value: 1.0
    normalize: true

  - variable: $components.expander.state_in.superheating
    type: ">"
    value: 5
    normalize: true

  # ── Power output target ──
  - variable: $energy_analysis.net_system_power
    type: "="
    value: 45000000
    normalize: true

  # ── Intermediate pressure ordering constraints ──
  # - variable: $components.expander.state_in.p / $variables.expander_intermediate_pressure_1
  #   type: ">"
  #   value: 1.0
  #   normalize: true

  # - variable: $variables.expander_intermediate_pressure_1 / $variables.expander_intermediate_pressure_2
  #   type: ">"
  #   value: 1.0
  #   normalize: true

  # - variable: $variables.expander_intermediate_pressure_2 / $components.expander.state_out.p
  #   type: ">"
  #   value: 1.0
  #   normalize: true

  # ── Per-stage Ns constraints ──
  - variable: $components.expander.data_out.stage_Ns
    type: ">"
    value: 0.045
    normalize: true

  - variable: $components.expander.data_out.stage_Ns
    type: "<"
    value: 0.195
    normalize: true

  # ── Per-stage Vr constraints ──
  - variable: $components.expander.data_out.stage_Vr
    type: "<"
    value: 5.0
    normalize: true

  - variable: $components.expander.data_out.stage_Vr
    type: ">"
    value: 1.2
    normalize: true


  # ============================================================================
  # OBJECTIVE FUNCTION
  # ============================================================================
  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
