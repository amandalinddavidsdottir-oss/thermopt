solver_options: 
  library: scipy
  method: slsqp
  derivative_method: 2-point 
  derivative_abs_step: 1e-6
  print_convergence: True 
  plot_convergence: False
  logger: None
  update_on: gradient
  tolerance: 1e-6 
  max_iterations: 200
  problem_scale: 20
  callbacks:
    save_plot: True
    save_config: True
    save_report: True
    plot_cycle: True
    plot_convergence: False


problem_formulation:

  # ============================================================================
  # TOPOLOGY: simple (no recuperator) for direct comparison with subcritical sweep
  # ============================================================================
  cycle_topology: simple

  plot_settings:
    pinch_point_diagram: False
    fluid: 
      plot_saturation_line: True
      plot_critical_point: True
      plot_quality_isolines: True
      plot_pseudocritical_line: False
      plot_triple_point_liquid: False
      plot_triple_point_vapor: False
    diagrams:
      - x_prop: s
        y_prop: T
        x_scale: linear
        y_scale: linear


  fixed_parameters:

    working_fluid:
      name: Butane
      backend: HEOS
      exceptions: True

    heating_fluid:
        name: water
        backend: HEOS
        exceptions: True

    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: True

    # ==========================================================================
    # WELL MASS FLOW RATE (mass-flow mode, required for astolfi-stacking)
    # ==========================================================================
    well_mass_flow_rate: 570.4  # kg/s — initial guess, to be calibrated for 45 MW
    
    # ==========================================================================
    # SPECIAL POINTS
    # ==========================================================================
    special_points:
      ambient_pressure: 101325  
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 470
    
    # ==========================================================================
    # HEAT SOURCE: Bjarnarflag Brine
    # ==========================================================================
    heat_source:
      inlet_temperature: 480.25       # ~207°C brine temperature
      minimum_temperature: 373.15     # 100°C reinjection limit
      inlet_pressure: 1801000         # Brine pressure
      exit_pressure: 1801000          # Brine pressure
    
    # ==========================================================================
    # HEAT SINK: Cooling water
    # ==========================================================================
    heat_sink:
      inlet_temperature: 295.15       # 22°C
      inlet_pressure: 101325
      exit_pressure: 101325

    # ==========================================================================
    # HEAT EXCHANGERS
    # ==========================================================================
    heater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    # ==========================================================================
    # Turbine/Compressor/Pumps
    # ==========================================================================
    expander:
      efficiency_type: "astolfi-stacking"
      n_stages: 2
      RPM: 1500

    compressor:
      efficiency: 0.85
      efficiency_type: "isentropic"

    heat_source_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"

    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"


  # ============================================================================
  # DESIGN VARIABLES
  # ============================================================================
  design_variables:
    heat_source_exit_temperature:
      min: 373.15                     # 100°C reinjection limit
      max: 465.25                     # 480.25 - 15 K
      value: 373.15                     # warm start: at reinjection limit

    heat_sink_exit_temperature:
      min: 310.15                     # 37°C
      max: 315.15                     # 42°C (environmental constraint)
      value: 310.15

    compressor_inlet_pressure:
      min: 0.9*$working_fluid.liquid_at_ambient_temperature.p
      max: 3.0*$working_fluid.liquid_at_ambient_temperature.p
      value: 1.72*$working_fluid.liquid_at_ambient_temperature.p  # warm start

    compressor_inlet_enthalpy:
      min: 0.0*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max: 0.5*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: 0.096*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h  # warm start

    # ==========================================================================
    # TRANSCRITICAL: expander inlet pressure allowed ABOVE critical pressure
    # The optimizer can explore both subcritical and supercritical regions
    # ==========================================================================
    expander_inlet_pressure:
      min: 0.1*$working_fluid.triple_point_vapor.p
      max: 3.0*$working_fluid.critical_point.p    # allows supercritical!
      value: 1.70*$working_fluid.critical_point.p   # warm start (above pc)

    expander_inlet_enthalpy:
      min: 0.20*$working_fluid.gas_at_maximum_temperature.h
      max: 1.00*$working_fluid.gas_at_maximum_temperature.h
      value: 0.86*$working_fluid.gas_at_maximum_temperature.h  # warm start

    # ── Mass-flow mode: expander mass flow as design variable ──
    expander_mass_flow_rate:
      min: 50.0
      max: 2000.0
      value: 500.0


  # ============================================================================
  # CONSTRAINTS
  # Note: superheat constraint is REMOVED — not meaningful for supercritical states
  # ============================================================================
  constraints:
    - variable: $components.heater.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.cooler.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.compressor.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True

    # Superheat constraint commented out — not applicable for transcritical
    # - variable: $components.expander.state_in.superheating
    #   type: ">"
    #   value: 5

    # ── Mass-flow mode: ensure expander mass flow equals cycle mass flow ──
    - variable: ($components.expander.mass_flow - $variables.expander_mass_flow_rate)
      type: "="
      value: 0.0


  # ============================================================================
  # OBJECTIVE FUNCTION
  # ============================================================================
  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
