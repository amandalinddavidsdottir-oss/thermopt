solver_options: 
  library: scipy
  method: slsqp
  derivative_method: 2-point 
  derivative_abs_step: 1e-6
  print_convergence: True 
  plot_convergence: False
  logger: None
  update_on: gradient
  tolerance: 1e-6
  max_iterations: 100
  problem_scale: 20
  callbacks:
    save_plot: False
    save_config: False
    save_report: False
    plot_cycle: False
    plot_convergence: False


problem_formulation:

  cycle_topology: recuperated

  plot_settings:
    pinch_point_diagram: False
    fluid: 
      plot_saturation_line: True
      plot_critical_point: True
      plot_quality_isolines: True
      plot_pseudocritical_line: False
      plot_triple_point_liquid: False
      plot_triple_point_vapor: False
    diagrams:
      - x_prop: s
        y_prop: T
        x_scale: linear
        y_scale: linear
        plot_heat_source: True
        plot_heat_sink: True


  fixed_parameters:

    working_fluid:
      name: n-Butane
      backend: HEOS
      exceptions: True

    heating_fluid:
        name: water
        backend: HEOS
        exceptions: True

    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: True

    special_points:
      ambient_pressure: 101325  
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 475.30

    heat_source:
      inlet_enthalpy: 1459430
      minimum_temperature: 373.15
      inlet_pressure: 1801300
      exit_pressure: 1801300

    heat_sink:
      inlet_temperature: 295.15
      inlet_pressure: 101325
      exit_pressure: 101325

    heater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    recuperator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    expander:
      efficiency: 0.90
      efficiency_type: "isentropic"
      n_turbines_parallel: 2

    compressor:
      efficiency: 0.85
      efficiency_type: "isentropic"

    heat_source_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"

    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"


  # ============================================================================
  # DESIGN VARIABLES
  # Warmstart values from optimal_solution.yaml
  # ============================================================================
  design_variables:
    well_mass_flow_rate:
      min: 1
      max: 600.0
      value: 181.163243638608

    mass_flow_rate_cycle:
      min: 20.0
      max: 1500.0
      value: 388.19819971979

    mass_flow_rate_sink:
      min: 100.0
      max: 20000.0
      value: 6850.250164199959

    heat_source_exit_temperature:
      min: 373.15
      max: 479.30
      value: 373.15

    heat_sink_exit_temperature:
      min: 300.15
      max: 315.15
      value: 300.15

    compressor_inlet_pressure:
      min: 1*$working_fluid.liquid_at_ambient_temperature.p
      max: 6.0*$working_fluid.liquid_at_ambient_temperature.p
      value: 296077.7107392292

    compressor_inlet_enthalpy:
      min: 0.0*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max:  0.5*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: 272922.8305218703

    expander_inlet_pressure:
      min: $working_fluid.liquid_at_ambient_temperature.p 
      max: 2*$working_fluid.critical_point.p
      value: 4404055.357990848

    expander_inlet_enthalpy:
      min: 0.0*($working_fluid.gas_at_maximum_temperature.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max:  1*($working_fluid.gas_at_maximum_temperature.h  - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: 915356.985818805

    recuperator_effectiveness:
      min: 0.0
      max: 0.95
      value: 0.684549225263

    # ── Intermediate stage pressures ──
    # expander_intermediate_pressure_1:
    #   min: 0.9*$working_fluid.liquid_at_ambient_temperature.p
    #   max: 0.8*$working_fluid.critical_point.p
    #   value: 0.080944*$working_fluid.critical_point.p

    # expander_intermediate_pressure_2:
    #   min: 0.9*$working_fluid.liquid_at_ambient_temperature.p
    #   max: 0.8*$working_fluid.critical_point.p
    #   value: 0.027180*$working_fluid.critical_point.p

    # expander_intermediate_pressure_3:
    #   min: 0.9*$working_fluid.liquid_at_ambient_temperature.p
    #   max: 0.8*$working_fluid.critical_point.p
    #   value: 0.008926*$working_fluid.critical_point.p


  # ============================================================================
  # CONSTRAINTS
  # ============================================================================
  constraints:
    - variable: $components.heater.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.cooler.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.recuperator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.compressor.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True

    - variable: $components.expander.state_in.superheating
      type: ">"
      value: 5
      normalize: True

    - variable: $energy_analysis.net_system_power
      type: "="
      value: 45000000
      normalize: True

    # ── Intermediate pressure ordering constraints ──
    # - variable: $components.expander.state_in.p / $variables.expander_intermediate_pressure_1
    #   type: ">"
    #   value: 1.0
    #   normalize: True

    # ── Per-stage Ns constraints ──
    # - variable: $components.expander.data_out.stage_Ns
    #   type: ">"
    #   value: 0.045
    #   normalize: True

    # - variable: $components.expander.data_out.stage_Ns
    #   type: "<"
    #   value: 0.195
    #   normalize: True

    # ── Per-stage Vr constraints ──
    # - variable: $components.expander.data_out.stage_Vr
    #   type: "<"
    #   value: 5.0
    #   normalize: True

    # - variable: $components.expander.data_out.stage_Vr
    #   type: ">"
    #   value: 1.2
    #   normalize: True


  # ============================================================================
  # OBJECTIVE FUNCTION
  # ============================================================================
  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
