cycle_topology: simple
plot_settings:
  pinch_point_diagram: false
  fluid:
    plot_saturation_line: true
    plot_critical_point: true
    plot_quality_isolines: true
    plot_pseudocritical_line: false
    plot_triple_point_liquid: false
    plot_triple_point_vapor: false
  diagrams:
  - x_prop: s
    y_prop: T
    x_scale: linear
    y_scale: linear
    plot_heat_source: true
    plot_heat_sink: true
fixed_parameters:
  working_fluid:
    name: cis-2-Butene
    backend: HEOS
    exceptions: true
  heating_fluid:
    name: water
    backend: HEOS
    exceptions: true
  cooling_fluid:
    name: water
    backend: HEOS
    exceptions: true
  special_points:
    ambient_pressure: 101325
    ambient_temperature: 293.15
    maximum_temperature: 475.3
  heat_source:
    inlet_enthalpy: 1459430
    minimum_temperature: 373.15
    inlet_pressure: 1801300
    exit_pressure: 1801300
  heat_sink:
    inlet_temperature: 295.15
    inlet_pressure: 101325
    exit_pressure: 101325
  heater:
    pressure_drop_hot_side: 0.01
    pressure_drop_cold_side: 0.01
    num_elements: 25
  cooler:
    pressure_drop_hot_side: 0.01
    pressure_drop_cold_side: 0.01
    num_elements: 25
  expander:
    efficiency: 0.9
    efficiency_type: isentropic
    n_turbines_parallel: 2
  compressor:
    efficiency: 0.85
    efficiency_type: isentropic
  heat_source_pump:
    efficiency: 0.8
    efficiency_type: isentropic
  heat_sink_pump:
    efficiency: 0.8
    efficiency_type: isentropic
design_variables:
  well_mass_flow_rate:
    min: 1
    max: 600.0
    value: 209.059907534548
  mass_flow_rate_cycle:
    min: 20.0
    max: 1500.0
    value: 384.027593267239
  mass_flow_rate_sink:
    min: 100.0
    max: 20000.0
    value: 8236.518903614484
  heat_source_exit_temperature:
    min: 373.15
    max: 479.3
    value: 373.15
  heat_sink_exit_temperature:
    min: 300.15
    max: 315.15
    value: 300.15
  compressor_inlet_pressure:
    min: 1*$working_fluid.liquid_at_ambient_temperature.p
    max: 6.0*$working_fluid.liquid_at_ambient_temperature.p
    value: 257296.41665341085
  compressor_inlet_enthalpy:
    min: 0.0*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h)
      + $working_fluid.liquid_at_ambient_temperature.h
    max: 0.5*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h)
      + $working_fluid.liquid_at_ambient_temperature.h
    value: 57978.52164173561
  expander_inlet_pressure:
    min: $working_fluid.liquid_at_ambient_temperature.p
    max: 2*$working_fluid.critical_point.p
    value: 5765704.254183108
  expander_inlet_enthalpy:
    min: 0.0*($working_fluid.gas_at_maximum_temperature.h - $working_fluid.liquid_at_ambient_temperature.h)
      + $working_fluid.liquid_at_ambient_temperature.h
    max: 1*($working_fluid.gas_at_maximum_temperature.h  - $working_fluid.liquid_at_ambient_temperature.h)
      + $working_fluid.liquid_at_ambient_temperature.h
    value: 634288.5241720461
constraints:
- variable: $components.heater.temperature_difference
  type: '>'
  value: 5
  normalize: true
- variable: $components.cooler.temperature_difference
  type: '>'
  value: 5
  normalize: true
- variable: $components.compressor.state_in.subcooling
  type: '>'
  value: 1.0
  normalize: true
- variable: $components.expander.state_in.superheating
  type: '>'
  value: 5
  normalize: true
- variable: $energy_analysis.net_system_power
  type: '='
  value: 45000000
  normalize: true
objective_function:
  variable: $energy_analysis.system_efficiency
  type: maximize
