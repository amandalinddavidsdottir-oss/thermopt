  hp_pump:
    efficiency: 0.85
    efficiency_type: isentropic
  heat_source_pump:
    efficiency: 0.8
    efficiency_type: isentropic
  heat_sink_pump:
    efficiency: 0.8
    efficiency_type: isentropic
