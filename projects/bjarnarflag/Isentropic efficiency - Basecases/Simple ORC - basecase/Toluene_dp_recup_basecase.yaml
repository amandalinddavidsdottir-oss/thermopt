solver_options:
  library: scipy
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 1e-6
  print_convergence: True
  plot_convergence: False
  logger: None
  update_on: gradient
  tolerance: 1e-6
  max_iterations: 300
  problem_scale: 20
  callbacks:
    save_plot: True
    save_config: True
    save_report: True
    plot_cycle: True
    plot_convergence: False

problem_formulation:
  cycle_topology: recuperated_dual_pressure 

  plot_settings:
    pinch_point_diagram: False
    fluid:
      plot_saturation_line: True
      plot_critical_point: True
      plot_quality_isolines: True
      plot_pseudocritical_line: False
      plot_triple_point_liquid: False
      plot_triple_point_vapor: False
    diagrams:
      - x_prop: s
        y_prop: T
        x_scale: linear
        y_scale: linear

  fixed_parameters:
    working_fluid:
      name: Toluene
      backend: HEOS
      exceptions: True
    heating_fluid:
      name: water
      backend: HEOS
      exceptions: True
    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: True
    special_points:
      ambient_pressure: 101325
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 475.30  # K = 202.15°C — single brine (207.15°C) minus 5K pinch. Hottest achievable Toluene state.
    heat_source:
      inlet_enthalpy: 1459430  # J/kg — two-phase brine (x=0.30), T_sat=207.15°C, P=18.013 bar-a
      minimum_temperature: 373.15
      inlet_pressure: 1801300
      exit_pressure: 1801300
    heat_sink:
      inlet_temperature: 295.15
      inlet_pressure: 101325
      exit_pressure: 101325

    # Three brine-side heat exchangers
    hp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    lp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    preheater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    # recuperator heat exchanger ---
    recuperator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    # Two expanders
    hp_expander:
      efficiency: 0.90
      efficiency_type: "isentropic"
      
    lp_expander:
      efficiency: 0.90
      efficiency_type: "isentropic"

    # Two pumps
    lp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"
    hp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"
    heat_source_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"
    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"

  design_variables:
    well_mass_flow_rate:
      min: 20.0
      max: 600.0
      value: 167.262290202829  # kg/s — from converged recuperated dual pressure ORC

    hp_expander_inlet_pressure:
      min: 0.1*$working_fluid.critical_point.p
      max: 0.2*$working_fluid.critical_point.p
      value: 712713.0354785081  # from converged recuperated dual pressure ORC

    hp_expander_inlet_enthalpy:
      min: 0.80*$working_fluid.gas_at_maximum_temperature.h
      max: 1.00*$working_fluid.gas_at_maximum_temperature.h
      value: 491793.7332513076  # from converged recuperated dual pressure ORC

    lp_expander_inlet_pressure:
      min: 0.01*$working_fluid.critical_point.p
      max: 0.15*$working_fluid.critical_point.p
      value: 496694.3763252686  # from converged recuperated dual pressure ORC

    lp_evaporator_outlet_enthalpy:
      min: 0.68*$working_fluid.gas_at_maximum_temperature.h
      max: 0.95*$working_fluid.gas_at_maximum_temperature.h
      value: 403404.82299877214  # from converged recuperated dual pressure ORC

    compressor_inlet_pressure:
      min: 1*$working_fluid.liquid_at_ambient_temperature.p
      max: 5.19*$working_fluid.liquid_at_ambient_temperature.p
      value: 5243.638216002753  # from converged recuperated dual pressure ORC

    compressor_inlet_enthalpy:
      min: 0.004*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max: 0.083*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: -149013.0992572881  # from converged recuperated dual pressure ORC

    mass_split_fraction:
      min: 0.20
      max: 0.80
      value: 0.8

    preheater_outlet_enthalpy:
      min: 0.015*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max: 0.55*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h  # raised — subcooling constraint at pump inlet is the true physical limit
      value: 80703.00311751603  # from converged recuperated dual pressure ORC

    heat_source_mid_temperature:
      min: 374.00  # K = 100.85°C — just above reinjection limit (373.15K).
      max: 479.30  # K = 206.15°C — 1K below brine T_sat (480.30K = 207.15°C).
      value: 477.048493992809

    heat_sink_exit_temperature:
      min: 300.15  # K = 27°C — CW inlet (295.15K) + 5K minimum temperature rise. Physical floor. 
      max: 315.15
      value: 300.15

    # ── Mass-flow mode: LP expander mass flow as design variable ──
    # lp_expander_mass_flow_rate:
    #   min: 50.0
    #   max: 1500.0
    #   value: 317.300  # kg/s

    # recuperator effectiveness
    recuperator_effectiveness:
      min: 0.0
      max: 0.95
      value: 0.47849032141  # from converged recuperated dual pressure ORC

    mass_flow_rate_cycle:
      min: 20.0
      max: 1500.0
      value: 300.071189  # kg/s — from converged recuperated dual pressure ORC

    mass_flow_rate_sink:
      min: 100.0
      max: 20000.0
      value: 6159.315  # kg/s — from converged recuperated dual pressure ORC

  constraints:
    # Pinch points for all three brine-side HXs
    - variable: $components.hp_evaporator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.lp_evaporator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.preheater.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.cooler.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.recuperator.temperature_difference
      type: ">"
      value: 5
      normalize: True    

    # Subcooling at pump inlet
    - variable: $components.lp_pump.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True

    - variable: $components.hp_pump.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True  

    # Superheating at HP turbine inlet
    - variable: $components.hp_expander.state_in.superheating
      type: ">"
      value: 5
      normalize: True

    # Superheating at LP expander inlet
    - variable: $components.lp_expander.state_in.superheating
      type: ">"
      value: 5
      normalize: True

    # Brine reinjection temperature limit
    - variable: $energy_analysis.brine_exit_temperature
      type: ">"
      value: 373.15
      normalize: True

    # ── Mass-flow mode: ensure LP expander mass flow equals cycle mass flow ──
    # - variable: $components.lp_expander.mass_flow / $variables.lp_expander_mass_flow_rate
    #   type: "="
    #   value: 1.0
    #   normalize: True

    # ── Power output target ──
    - variable: $energy_analysis.net_system_power
      type: "="
      value: 45000000  # W (= 45 MW)
      normalize: True

  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
