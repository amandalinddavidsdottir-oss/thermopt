solver_options:
  library: scipy
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 1e-6
  print_convergence: True
  plot_convergence: False
  logger: None
  update_on: gradient
  tolerance: 1e-6
  max_iterations: 100
  problem_scale: 20
  callbacks:
    save_plot: False #this was true, but not in multistart runs
    save_config: False #this was true, but not in multistart runs
    save_report: False #this was true, but not in multistart runs
    plot_cycle: False #this was true, but not in multistart runs
    plot_convergence: False

problem_formulation:
  cycle_topology: dual_pressure

  plot_settings:
    pinch_point_diagram: False
    fluid:
      plot_saturation_line: True
      plot_critical_point: True
      plot_quality_isolines: True
      plot_pseudocritical_line: False
      plot_triple_point_liquid: False
      plot_triple_point_vapor: False
    diagrams:
      - x_prop: s
        y_prop: T
        x_scale: linear
        y_scale: linear
        plot_heat_source: True   # set to False to hide the brine line
        plot_heat_sink: True     # set to False to hide the cooling water line

  fixed_parameters:
    working_fluid:
      name: Toluene
      backend: HEOS
      exceptions: True
    heating_fluid:
      name: water
      backend: HEOS
      exceptions: True
    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: True
    special_points:
      ambient_pressure: 101325
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 475.30  # K = 202.15°C — single brine (207.15°C) minus 5K pinch. Hottest achievable Toluene state.
    heat_source:
      inlet_enthalpy: 1459430  # J/kg — two-phase brine (x=0.30), T_sat=207.15°C, P=18.013 bar-a
      minimum_temperature: 373.15
      inlet_pressure: 1801300
      exit_pressure: 1801300
    heat_sink:
      inlet_temperature: 295.15
      inlet_pressure: 101325
      exit_pressure: 101325

    # Three brine-side heat exchangers
    hp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    lp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    preheater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    # Two expanders — Macchi & Astolfi correlation
    hp_expander:
      efficiency: 0.90
      efficiency_type: "isentropic" 
      
    lp_expander:
      efficiency: 0.90
      efficiency_type: "isentropic"   
      n_turbines_parallel: 2 #Two turbines in parallel


    # Two pumps
    lp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"
    hp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"
    heat_source_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"
    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"


  design_variables:
    well_mass_flow_rate:
      min: 1
      max: 600.0
      value: 179.052932086505  # kg/s 

    mass_split_fraction:
      min: 0.01 # was 0.2
      max: 0.99 # was 0.8
      value: 0.9  

    mass_flow_rate_cycle:
      min: 20.0
      max: 1500.0
      value: 295.046495304926  

    mass_flow_rate_sink:
      min: 100.0
      max: 20000.0
      value: 6716.441934124947  


    # Brine exit temperatures defined as fractions — ordering guaranteed by construction:
    #   T_reinjection <= T_preheater_exit <= T_lp_evap_exit <= T_hp_evap_exit <= T_brine_inlet
    # fraction=0: brine exits at reinjection limit, fraction=1: brine exits at upstream temperature
    heat_source_hp_evap_exit_temperature_fraction:
      min: 0.01
      max: 0.99
      value: 0.854105253403

    heat_source_lp_evap_exit_temperature_fraction:
      min: 0.01
      max: 0.99
      value: 0.871577375517  # consistent with lp_evap_outlet_enthalpy and mass flows at initial guess

    heat_source_preheater_exit_temperature_fraction:
      min: 0.01
      max: 0.99
      value: 0.010000  # brine exits preheater just above reinjection limit  

    heat_sink_exit_temperature:
      min: 300.15  # K = 27°C — CW inlet (295.15K) + 5K minimum temperature rise. Physical floor. 
      max: 315.15
      value: 300.15  



    compressor_inlet_pressure:
      min: 1*$working_fluid.liquid_at_ambient_temperature.p
      max: 6.0*$working_fluid.liquid_at_ambient_temperature.p
      value: 5141.660463762877


    compressor_inlet_enthalpy:
      min: 0.0*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max:  0.5*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: -149698.95099460267



    preheater_outlet_enthalpy:
      min: 0.0*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max:  1*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: 56303.83565576823

    
    # Intermediate (LP) expander inlet pressure, defined as a fraction between
    # condensation pressure (fraction=0) and evaporation pressure (fraction=1):
    #
    #   p_lp = fraction * p_cond + (1 - fraction) * p_evap
    #
    # This way, any initial guess used in multistart will always give a pressure
    # that is between p_cond and p_evap, so LP < HP is always satisfied from
    # the start without needing an explicit ordering constraint.
    lp_expander_inlet_pressure_fraction: 
      min: 0.01 
      max: 0.99 
      value: 0.495186310574


    lp_evaporator_outlet_enthalpy: 
      min: 0.0*($working_fluid.gas_at_maximum_temperature.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max:  1*($working_fluid.gas_at_maximum_temperature.h  - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: 371992.92776959913 



    hp_expander_inlet_pressure:
      min: $working_fluid.liquid_at_ambient_temperature.p
      max: 2*$working_fluid.critical_point.p  
      value: 712857.736816557


    hp_expander_inlet_enthalpy: 
      min: 0.0*($working_fluid.gas_at_maximum_temperature.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max:  1*($working_fluid.gas_at_maximum_temperature.h  - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: 491788.32140959206  

    

  

  constraints:
    # Pinch points for all three brine-side HXs
    - variable: $components.hp_evaporator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.lp_evaporator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.preheater.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.cooler.temperature_difference
      type: ">"
      value: 5
      normalize: True

    # Subcooling at pump inlet
    - variable: $components.lp_pump.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True

    - variable: $components.hp_pump.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True  

    # Superheating at HP turbine inlet
    - variable: $components.hp_expander.state_in.superheating
      type: ">"
      value: 5
      normalize: True

    # Superheating at LP expander inlet
    - variable: $components.lp_expander.state_in.superheating
      type: ">"
      value: 5
      normalize: True

    # ── Mass-flow mode: ensure LP expander mass flow equals cycle mass flow ── ONLY NEEDED FOR ASTOLFI CORRELATIONS
    # - variable: $components.lp_expander.mass_flow / $variables.lp_expander_mass_flow_rate
    #   type: "="
    #   value: 1.0
    #   normalize: True



    # ── Energy balance constraints ──
    # Because mass flow rates are passed as input variables to all heat exchanger
    # components, the hot-side and cold-side energy flows are computed
    # independently. The energy balance Q_hot = Q_cold is therefore not
    # automatically satisfied and must be enforced as an equality
    # constraint for each brine-side heat exchanger.

    # - variable: $components.hp_evaporator.energy_analysis.Q_hot / $components.hp_evaporator.energy_analysis.Q_cold
    #   type: "="
    #   value: 1.0
    #   normalize: True

    # - variable: $components.lp_evaporator.energy_analysis.Q_hot / $components.lp_evaporator.energy_analysis.Q_cold
    #   type: "="
    #   value: 1.0
    #   normalize: True

    # - variable: $components.preheater.energy_analysis.Q_hot / $components.preheater.energy_analysis.Q_cold
    #   type: "="
    #   value: 1.0
    #   normalize: True


    # ── Power output target ──
    - variable: $energy_analysis.net_system_power
      type: "="
      value: 45000000  # W (= 45 MW)
      normalize: True



  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize