solver_options:
  library: scipy
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 1e-6
  print_convergence: True
  plot_convergence: False
  logger: None
  update_on: gradient
  tolerance: 1e-6
  max_iterations: 300
  problem_scale: 20
  callbacks:
    save_plot: True
    save_config: True
    save_report: True
    plot_cycle: True
    plot_convergence: False

problem_formulation:
  cycle_topology: dual_pressure

  plot_settings:
    pinch_point_diagram: False
    fluid:
      plot_saturation_line: True
      plot_critical_point: True
      plot_quality_isolines: True
      plot_pseudocritical_line: False
      plot_triple_point_liquid: False
      plot_triple_point_vapor: False
    diagrams:
      - x_prop: s
        y_prop: T
        x_scale: linear
        y_scale: linear

  fixed_parameters:
    working_fluid:
      name: Toluene
      backend: HEOS
      exceptions: True
    heating_fluid:
      name: water
      backend: HEOS
      exceptions: True
    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: True
    special_points:
      ambient_pressure: 101325
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 512.03 # K = 238.88°C — HP brine (243.88°C) minus 5K pinch

    # ── Two-source mode: HP and LP brine streams kept separate ──
    # HP brine: well 2 only — T_sat = 243.88°C, h = 1845.8 kJ/kg, m_max = 21.0 kg/s
    heat_source_hp:
      inlet_enthalpy: 1845800       # J/kg
      inlet_pressure: 3581300       # Pa  (34.8 bar-g = 35.813 bar-a)
      exit_pressure:  3581300       # Pa  (reinjection back to well pressure)
      minimum_temperature: 373.15   # K   (100°C reinjection limit)

    # LP brine: wells 1, 3, 4 mixed — T_sat = 207.15°C, h_mix = 1382.08 kJ/kg, m_max = 104.9 kg/s
    heat_source_lp:
      inlet_enthalpy: 1382080       # J/kg
      inlet_pressure: 1801300       # Pa  (17.0 bar-g = 18.013 bar-a)
      exit_pressure:  1801300       # Pa  (reinjection back to well pressure)
      minimum_temperature: 373.15   # K   (100°C reinjection limit)

    heat_sink:
      inlet_temperature: 295.15
      inlet_pressure: 101325
      exit_pressure: 101325

    # Three brine-side heat exchangers
    hp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    lp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    preheater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    # Two expanders
    hp_expander:
      efficiency: 0.90
      efficiency_type: "isentropic"
    lp_expander:
      efficiency: 0.90
      efficiency_type: "isentropic"

    # Two ORC-side pumps
    lp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"
    hp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"

    # Two brine reinjection pumps (one per stream)
    heat_source_pump_hp:
      efficiency: 0.80
      efficiency_type: "isentropic"
    heat_source_pump_lp:
      efficiency: 0.80
      efficiency_type: "isentropic"

    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"

  design_variables:
    hp_expander_inlet_pressure:
      min: 0.25*$working_fluid.critical_point.p   # T_sat = 218.7°C — HP well above LP brine T_sat (207°C)
      max: 0.3435*$working_fluid.critical_point.p  # T_sat = 238.9°C — exactly 243.88°C brine minus 5K pinch
      value: 0.302301*$working_fluid.critical_point.p  # warm-started from converged solution

    hp_expander_inlet_enthalpy:
# Upper bound: max physically achievable enthalpy given HP brine at 243.88°C.
# Toluene cannot exceed T_brine - 5K pinch = 238.88°C at the HP expander inlet.
# At 238.88°C across the full HP pressure range (0.25–0.3435×p_crit),
# h_max spans 540–554 kJ/kg = 0.954–0.979×h_crit.
# Using 0.97×h_crit = ~549 kJ/kg covers the full range with a small safety margin.
# (The superheating constraint > 5K will always be the active limit in practice.)
      min: 0.90*$working_fluid.critical_point.h # was 0.90 — corrected to above h_sat_vap at HP max pressure
      max: 0.979*$working_fluid.critical_point.h
      value: 0.959159*$working_fluid.critical_point.h  # warm-started from converged solution

    lp_expander_inlet_pressure:
      min: 0.01*$working_fluid.critical_point.p
      max: 0.1888*$working_fluid.critical_point.p  
      value: 0.184632*$working_fluid.critical_point.p  # warm-started from converged solution

    lp_evaporator_outlet_enthalpy:
      min: 0.68*$working_fluid.gas_at_maximum_temperature.h # h_sat_vapor at lowest LP pressure (0.05*p_crit, T_sat=137°C) / h_gas_max_T = 0.6872. Rounded down to 0.68 to keep bound below sat vapor at all LP pressures. Superheating constraint (> 5K) enforces the true physical minimum.
      max: 0.876*$working_fluid.gas_at_maximum_temperature.h 
      value: 0.846193*$working_fluid.gas_at_maximum_temperature.h  # warm-started from converged solution

    compressor_inlet_pressure:
      min: 1.45*$working_fluid.liquid_at_ambient_temperature.p # p_sat(27°C) = CW inlet (22°C) + 5K pinch = 1.4421*p_liq_amb. Below this, Toluene condensing temperature falls below the cooling water inlet — heat transfer reverses direction, physically impossible.
      max: 5.19*$working_fluid.liquid_at_ambient_temperature.p # p_sat(55°C) — practical ceiling. No hard physical upper limit exists above the 27°C floor, but higher condensing temperature reduces the turbine pressure ratio and lowers power output. The cooler pinch constraint (> 5K) enforces feasibility at whatever value is chosen.
      value: 1.761475*$working_fluid.liquid_at_ambient_temperature.p  # warm-started from converged solution

    compressor_inlet_enthalpy:
      min: 0.004*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h # h at ~5K subcooling at the minimum condenser pressure (1.45*p_liq_amb, T_sat=27°C). The subcooling constraint (> 1K) enforces the true minimum at whatever condenser pressure the optimizer selects.
      max: 0.083*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h #h_sat_liquid at the maximum condenser pressure (5.19*p_liq_amb, T_sat=55°C). Above this, Toluene is two-phase at the pump inlet — causes cavitation. The subcooling constraint (> 1K) enforces the true ceiling at whatever condenser pressure the optimizer selects.
      value: 0.023111*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h  # warm-started from converged solution

    mass_split_fraction:
      min: 0.20
      max: 0.80
      value: 0.2  # warm-started from converged solution

    mass_flow_rate_hp:
      min: 20.0     # kg/s — practical lower floor
      max: 600.0    # kg/s — fully scalable, same as LP and dp_basecase well_mass_flow_rate
      value: 23.602678  # kg/s — warm-started from converged solution

    mass_flow_rate_lp:
      min: 100.0    # kg/s — raised from 50; below ~300 will be infeasible at 45 MW anyway, but 100 gives optimizer room to explore
      max: 600.0
      value: 166.688026  # kg/s — warm-started from converged solution

    # Working fluid mass flow rate — needed to pass actual mass flow to expanders
    # (required for Astolfi correlation; consistency constraint closes the loop)
    # lp_expander_mass_flow_rate:
    #   min: 50.0     # kg/s — practical lower floor
    #   max: 1500   # kg/s — physically consistent with 45 MW target (~300 MW heat / ~150 kJ/kg enthalpy drop)
    #   value: 294.476  # kg/s — warm-started from converged solution

    preheater_outlet_enthalpy:
      min: 0.014*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max: 0.49*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h # Above this, Toluene is two-phase at every LP pressure — always physically impossible.
      value: 0.483317*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h  # warm-started from converged solution

    heat_source_mid_temperature:
      min: 497.00   # K — hard physical floor: T_sat(Toluene) at HP min pressure (0.25*p_crit, ~492 K) + 5 K pinch margin
      max: 516.15   # K — close to HP brine T_sat = 243.88°C = 517 K; cannot exceed or brine flashes
      value: 507.911019  # warm-started from converged solution

    heat_sink_exit_temperature:
      min: 300.15 # Physical floor: CW inlet (295.15K) + 5K cooler pinch = 300.15K.
      max: 315.15
      value: 300.15  # warm-started from converged solution — at minimum bound

  constraints:
    # Pinch points for all three brine-side HXs
    - variable: $components.hp_evaporator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.lp_evaporator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.preheater.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.cooler.temperature_difference
      type: ">"
      value: 5
      normalize: True

    # Subcooling at pump inlet
    - variable: $components.lp_pump.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True

    - variable: $components.hp_pump.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True  

    # Superheating at HP expander inlet
    - variable: $components.hp_expander.state_in.superheating
      type: ">"
      value: 5
      normalize: True

    # Superheating at LP expander inlet
    - variable: $components.lp_expander.state_in.superheating
      type: ">"
      value: 5
      normalize: True

    # HP brine reinjection temperature (= heat_source_mid_temperature when pinch is active)
    - variable: $energy_analysis.hp_brine_exit_temperature
      type: ">"
      value: 373.15
      normalize: True

    # LP brine reinjection temperature (computed from preheater energy balance)
    - variable: $energy_analysis.lp_brine_exit_temperature
      type: ">"
      value: 373.15
      normalize: True

    # # ── Working fluid mass flow consistency ── only needed in Astolfi correlations
    # - variable: $components.lp_expander.mass_flow / $variables.lp_expander_mass_flow_rate
    #   type: "="
    #   value: 1.0
    #   normalize: True

    # ── Power output target ──
    - variable: $energy_analysis.net_system_power
      type: "="
      value: 45000000  # W (= 45 MW)
      normalize: True

  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
