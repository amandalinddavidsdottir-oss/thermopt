solver_options:
  library: scipy
  method: slsqp
  derivative_method: 2-point
  derivative_abs_step: 1e-6
  print_convergence: True
  plot_convergence: False
  logger: None
  update_on: gradient
  tolerance: 1e-6
  max_iterations: 300
  problem_scale: 20
  callbacks:
    save_plot: True
    save_config: True
    save_report: True
    plot_cycle: True
    plot_convergence: False

problem_formulation:
  cycle_topology: dual_pressure

  plot_settings:
    pinch_point_diagram: False
    fluid:
      plot_saturation_line: True
      plot_critical_point: True
      plot_quality_isolines: True
      plot_pseudocritical_line: False
      plot_triple_point_liquid: False
      plot_triple_point_vapor: False
    diagrams:
      - x_prop: s
        y_prop: T
        x_scale: linear
        y_scale: linear

  fixed_parameters:
    working_fluid:
      name: Toluene
      backend: HEOS
      exceptions: True
    heating_fluid:
      name: water
      backend: HEOS
      exceptions: True
    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: True
    special_points:
      ambient_pressure: 101325
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 470
    heat_source:
      inlet_enthalpy: 1459430  # J/kg — two-phase brine (x=0.30), T_sat=207.15°C, P=18.013 bar-a
      minimum_temperature: 373.15
      inlet_pressure: 1801300
      exit_pressure: 1801300
    heat_sink:
      inlet_temperature: 295.15
      inlet_pressure: 101325
      exit_pressure: 101325

    # Three brine-side heat exchangers
    hp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    lp_evaporator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    preheater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25
    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    # Two expanders — Macchi & Astolfi correlation
    hp_expander:
      efficiency: 0.90
      efficiency_type: "isentropic" 
      
    lp_expander:
      efficiency: 0.90
      efficiency_type: "isentropic"   


    # Two pumps
    lp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"
    hp_pump:
      efficiency: 0.85
      efficiency_type: "isentropic"
    heat_source_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"
    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"

  design_variables:
    well_mass_flow_rate:
      min: 50.0
      max: 600.0
      value: 184.371235  # kg/s — from converged dual pressure ORC

    hp_expander_inlet_pressure:
      min: 0.05*$working_fluid.critical_point.p
      max: 0.25*$working_fluid.critical_point.p
      value: 0.172758*$working_fluid.critical_point.p  # from converged dual pressure ORC
      

    hp_expander_inlet_enthalpy:
      # Switched to h_crit reference for consistency with dp_twosource and physical accuracy.
      # h_gas_max (~505 kJ/kg) was below h_sat_vap at HP pressure (~482 kJ/kg) — poor reference.
      min: 0.90*$working_fluid.critical_point.h  # ~509 kJ/kg — just above sat vapor at HP pressure
      max: 1.10*$working_fluid.critical_point.h  # ~622 kJ/kg — moderately superheated
      value: 0.8741*$working_fluid.critical_point.h  # equivalent to 0.980121*h_gas_max

    lp_expander_inlet_pressure:
      min: 0.01*$working_fluid.critical_point.p
      max: 0.19*$working_fluid.critical_point.p  # raised from 0.15 — LP brine T_sat=207.15°C, consistent with dp_twosource
      value: 0.104966*$working_fluid.critical_point.p  # from converged dual pressure ORC
    

    lp_evaporator_outlet_enthalpy:
      min: 0.80*$working_fluid.gas_at_maximum_temperature.h
      max: 0.95*$working_fluid.gas_at_maximum_temperature.h
      value: 0.826547*$working_fluid.gas_at_maximum_temperature.h  # from converged dual pressure ORC

    compressor_inlet_pressure:
      min: 0.9*$working_fluid.liquid_at_ambient_temperature.p
      max: 3.0*$working_fluid.liquid_at_ambient_temperature.p
      value: 2.155202*$working_fluid.liquid_at_ambient_temperature.p  # from converged dual pressure ORC

    compressor_inlet_enthalpy:
      min: 0.01*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max: 0.15*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: 0.033007*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h  # from converged dual pressure ORC

    mass_split_fraction:
      min: 0.20
      max: 0.80
      value: 0.80  # from converged dual pressure ORC (hit upper bound — optimizer wants more HP flow)


    preheater_outlet_enthalpy:
      min: 0.05*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max: 0.70*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h  # raised — subcooling constraint at pump inlet is the true physical limit
      value: 0.268997*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h  # from converged dual pressure ORC

    heat_source_mid_temperature:
      min: 393.15
      max: 470.25
      value: 470.25  # K — from converged dual pressure ORC (hit upper bound)

    heat_sink_exit_temperature:
      min: 305.15
      max: 315.15
      value: 305.15  # K — from converged dual pressure ORC (hit lower bound)

    # ── Mass-flow mode: LP expander mass flow as design variable ── ONLY NEEDED FOR ASTOLFI CORRELATIONS
    # lp_expander_mass_flow_rate:
    #   min: 50.0
    #   max: 1500.0
    #   value: 310.002  # kg/s — from converged dual pressure ORC

    # NOTE: heat_source_exit_temperature is NOT a design variable.
    # T_HS,out is computed from the energy balance chain.
    # The reinjection limit is enforced as a constraint below.

  constraints:
    # Pinch points for all three brine-side HXs
    - variable: $components.hp_evaporator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.lp_evaporator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.preheater.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.cooler.temperature_difference
      type: ">"
      value: 5
      normalize: True

    # Subcooling at pump inlet
    - variable: $components.lp_pump.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True

    - variable: $components.hp_pump.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True  

    # Superheating at HP turbine inlet
    - variable: $components.hp_expander.state_in.superheating
      type: ">"
      value: 5
      normalize: True

    # Superheating at LP expander inlet
    - variable: $components.lp_expander.state_in.superheating
      type: ">"
      value: 5
      normalize: True

    # Brine reinjection temperature limit (T_HS,out is COMPUTED, not a design variable)
    - variable: $energy_analysis.brine_exit_temperature
      type: ">"
      value: 373.15
      normalize: True

    # ── Mass-flow mode: ensure LP expander mass flow equals cycle mass flow ── ONLY NEEDED FOR ASTOLFI CORRELATIONS
    # - variable: $components.lp_expander.mass_flow / $variables.lp_expander_mass_flow_rate
    #   type: "="
    #   value: 1.0
    #   normalize: True


    # ── Power output target ──
    - variable: $energy_analysis.net_system_power
      type: "="
      value: 45000000  # W (= 45 MW)
      normalize: True



  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize