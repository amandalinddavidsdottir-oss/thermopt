solver_options: 
  library: scipy
  method: slsqp
  derivative_method: 2-point 
  derivative_abs_step: 1e-6
  print_convergence: True 
  plot_convergence: False
  logger: None
  update_on: gradient
  tolerance: 1e-6 
  max_iterations: 200
  problem_scale: 20
  callbacks:
    save_plot: True
    save_config: True
    save_report: True
    plot_cycle: True
    plot_convergence: False


problem_formulation:

  cycle_topology: recuperated

  plot_settings:
    pinch_point_diagram: False
    fluid: 
      plot_saturation_line: True
      plot_critical_point: True
      plot_quality_isolines: True
      plot_pseudocritical_line: False
      plot_triple_point_liquid: False
      plot_triple_point_vapor: False
    diagrams:
      - x_prop: s
        y_prop: T
        x_scale: linear
        y_scale: linear


  fixed_parameters:

    working_fluid:
      name: Toluene
      backend: HEOS
      exceptions: True

    heating_fluid:
        name: water
        backend: HEOS
        exceptions: True

    cooling_fluid:
      name: water
      backend: HEOS
      exceptions: True

    # ==========================================================================
    # WELL MASS FLOW RATE (replaces net_power for mass-flow mode)
    # ==========================================================================
    well_mass_flow_rate: 570.4  # kg/s — matches 45 MW net power case
    
    # ==========================================================================
    # SPECIAL POINTS
    # ==========================================================================
    special_points:
      ambient_pressure: 101325  
      ambient_temperature: 20.0 + 273.15
      maximum_temperature: 470
    
    # ==========================================================================
    # HEAT SOURCE: Bjarnarflag Brine
    # ==========================================================================
    heat_source:
      inlet_temperature: 480.25
      minimum_temperature: 373.15
      inlet_pressure: 1801000
      exit_pressure: 1801000
    
    # ==========================================================================
    # HEAT SINK
    # ==========================================================================
    heat_sink:
      inlet_temperature: 295.15
      inlet_pressure: 101325
      exit_pressure: 101325

    # ==========================================================================
    # HEAT EXCHANGERS
    # ==========================================================================
    heater:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    cooler:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    recuperator:
      pressure_drop_hot_side: 0.01
      pressure_drop_cold_side: 0.01
      num_elements: 25

    # ==========================================================================
    # Turbine/Compressor/Pumps
    # ==========================================================================
    expander:
      efficiency_type: "macchi-astolfi"
      n_stages: 3          # 1, 2, or 3 — run separately for each
      RPM: 3000            # 2-pole 50 Hz synchronous generator

    compressor:
      efficiency: 0.85
      efficiency_type: "isentropic"

    heat_source_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"

    heat_sink_pump:
      efficiency: 0.80
      efficiency_type: "isentropic"


  # ============================================================================
  # DESIGN VARIABLES
  # ============================================================================
  design_variables:
    heat_source_exit_temperature:
      min: 373.15
      max: 465.25
      value: 373.168
      
    heat_sink_exit_temperature:
      min: 310.15
      max: 315.15
      value: 310.176

    compressor_inlet_pressure:
      min: 0.9*$working_fluid.liquid_at_ambient_temperature.p
      max: 3.0*$working_fluid.liquid_at_ambient_temperature.p
      value: 8102.03

    compressor_inlet_enthalpy:
      min: 0.01*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      max:  0.15*($working_fluid.critical_point.h - $working_fluid.liquid_at_ambient_temperature.h) + $working_fluid.liquid_at_ambient_temperature.h
      value: -154800.06
    
    expander_inlet_pressure:
      min: 0.05*$working_fluid.triple_point_vapor.p
      max: 0.8*$working_fluid.critical_point.p
      value: 196859.64

    expander_inlet_enthalpy:
      min: 0.80*$working_fluid.gas_at_maximum_temperature.h 
      max: 1*$working_fluid.gas_at_maximum_temperature.h
      value: 403660.02

    recuperator_effectiveness:
      min: 0.0
      max: 0.95
      value: 0.2191


    expander_mass_flow_rate:
      min: 50.0
      max: 1500.0
      value: 488.83


  # ============================================================================
  # CONSTRAINTS
  # ============================================================================
  constraints:
    - variable: $components.heater.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.cooler.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.recuperator.temperature_difference
      type: ">"
      value: 5
      normalize: True

    - variable: $components.compressor.state_in.subcooling
      type: ">"
      value: 1.0
      normalize: True

    # a minimum superheating of 1 K was imposed to ensure fully vapour conditions at the turbine inlet
    - variable: $components.expander.state_in.superheating
      type: ">"
      value: 1

    # ── Mass-flow mode: ensure expander mass flow equals cycle mass flow ──
    - variable: ($components.expander.mass_flow - $variables.expander_mass_flow_rate)
      type: "="
      value: 0.0



  # ============================================================================
  # OBJECTIVE FUNCTION
  # ============================================================================
  objective_function:
    variable: $energy_analysis.system_efficiency
    type: maximize
